[package]
name = "comments"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
soroban-sdk = { workspace = true }
zkvote-groth16 = { path = "../zkvote-groth16" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }

[features]
# NOTE: deliberately does NOT forward `zkvote-groth16/testutils`.
# That feature replaces proof verification with `true`. Forwarding it
# here would mean `cargo build --all-features` links a contract that
# accepts every proof, so the stub is reachable from a deployable
# build purely by asking for all features.
testutils = ["soroban-sdk/testutils"]
