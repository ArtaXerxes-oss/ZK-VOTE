\* check the TrailingLiveness property (VoteMode::Trailing starvation).

SPECIFICATION FairSpec
INVARIANT Invariants

\* Issue #552: Liveness property for VoteMode::Trailing starvation.
\* TLC checks that a continuously-enabled trailing vote is eventually cast.
PROPERTY TrailingLiveness

CONSTANTS
    MAX_ROOT_HISTORY = 30
    MAX_TREE_DEPTH = 3
    MAX_DAOS = 2
    MAX_PROPOSALS = 2
    MAX_MEMBERS = 35
    MAX_NULLIFIERS = 8

CHECK_DEADLOCK TRUE
