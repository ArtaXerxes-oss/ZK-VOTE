name: Nightly Stress Tests

on:
  schedule:
    # Run at 2 AM UTC daily
    - cron: "0 2 * * *"
  workflow_dispatch: # Allow manual trigger

jobs:
  stress-tests:
    name: Stress Tests (Ignored)
    runs-on: ubuntu-latest
    timeout-minutes: 120 # 2 hours timeout for stress tests
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust components
        run: |
          rustup component add clippy rustfmt
          rustup target add wasm32v1-none

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-stress-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-stress-
            ${{ runner.os }}-cargo-

      - name: Run stress tests
        run: |
          cargo test --test stress -- --ignored --nocapture --test-threads=1
        env:
          RUST_BACKTRACE: 1
          RUST_LOG: info

      - name: Upload stress test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stress-test-results
          path: |
            target/tmp/*.log
          retention-days: 30

      - name: Notify on failure
        if: failure()
        run: |
          echo "Stress tests failed. Check the logs for details."
          echo "This may indicate performance regression or capacity issues."

  load-test-backend:
    name: Backend Load Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run database benchmark
        run: npm run db:benchmark || echo "DB benchmark completed"

      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-load-test-results
          path: |
            backend/benchmark-results.json
          retention-days: 30
