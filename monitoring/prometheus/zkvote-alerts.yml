groups:
  - name: zkvote-relayer
    rules:
      - alert: ZKVoteRelayerHighErrorRate
        expr: sum(rate(zkvote_http_requests_total{status=~"5.."}[5m])) / clamp_min(sum(rate(zkvote_http_requests_total[5m])), 1) > 0.05
        for: 10m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: ZKVote relayer error rate is elevated
          description: More than 5% of relayer requests have returned 5xx for 10 minutes.
      - alert: ZKVoteRelayerHighLatency
        expr: histogram_quantile(0.95, sum by (le) (rate(zkvote_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: ZKVote relayer latency is high
          description: HTTP request p95 latency has exceeded 2 seconds for 10 minutes.
      - alert: ZKVoteRelayerIndexerStalled
        expr: zkvote_service_running{service="indexer"} == 1 and time() - zkvote_service_last_run_timestamp_seconds{service="indexer"} > 600
        for: 5m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: ZKVote indexer appears stalled
          description: The indexer has not completed a successful run for more than 10 minutes.
      - alert: ZKVoteRelayerDatabaseUnavailable
        expr: zkvote_db_write_healthy == 0
        for: 5m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: ZKVote database write connection is unhealthy
          description: The relayer write database connection has been unhealthy for 5 minutes.
      - alert: ZKVoteRelayerHighUnauthenticatedRejections
        expr: sum(rate(zkvote_unauthenticated_rejection_total[5m])) > 10
        for: 5m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: High rate of unauthenticated requests rejected
          description: More than 10 unauthenticated requests per second have been rejected for 5 minutes.
      - alert: ZKVoteRelayerCrossTenantViolation
        expr: sum(rate(zkvote_cross_tenant_denial_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: Cross-tenant access denial detected
          description: Cross-tenant isolation violation attempted on relayer resources.
      - alert: ZKVoteRelayerReconciliationMismatch
        expr: sum(rate(zkvote_reconciliation_mismatch_total[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: State reconciliation mismatch detected
          description: State divergence detected between SQLite cache and Soroban on-chain state.
      - alert: ZKVoteRelayerDaoTallyMismatch
        expr: sum(rate(zkvote_reconciliation_mismatch_total{component="dao_tally"}[5m])) > 0
        for: 2m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: DAO hash-vs-DB tally mismatch detected
          description: Per-DAO vote_cast hash count (Horizon/stellar.expert) diverges from relayer DB pipeline counts. See FIX_REPORT.md blast-radius workflow.
      - alert: ZKVoteRelayerDaoReconciliationStale
        expr: time() - zkvote_dao_reconciliation_last_ok_timestamp_seconds > 900
        for: 5m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: DAO reconciliation has not completed cleanly
          description: No fully-consistent DAO reconciliation run in the last 15 minutes.
      - alert: ZKVoteRelayerRateLimitStoreExhaustion
        expr: zkvote_rate_limit_store_size > 50000
        for: 5m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: Rate limit store capacity elevated
          description: In-memory rate limit store tracking over 50,000 active keys.
      - alert: ZKVoteRelayerBatchPartialFailureSpike
        expr: sum(rate(zkvote_batch_partial_failure_total[5m])) > 1
        for: 5m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: Batch partial failure rate elevated
          description: Elevated partial failures observed in multi-item batch execution.
      - alert: ZKVoteRelayerBackupStale
        expr: zkvote_backup_age_seconds > 93600
        for: 15m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: No successful backup for over 26 hours
          description: Backup age exceeds 26h; litestream/S3 replication or scheduled backups may be stalled. Verify litestream.yml sync and S3 backup.
      - alert: ZKVoteRelayerRestoreDrillFailing
        expr: sum(rate(zkvote_backup_restore_drill_total{status="error"}[15m])) > 0
        for: 5m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: Encrypted restore drill failing
          description: Restore drills are failing; backups may not be recoverable or forward secrecy check is tripping. Run backup:key-rotate drill and check key ring.
      - alert: ZKVoteRelayerFeeSurge
        expr: sum(rate(zkvote_rpc_errors_total{error_type=~"fee|congestion|surge"}[5m])) > 0.5
        for: 5m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: Possible fee surge delaying vote inclusion
          description: Fee/congestion RPC errors rising; surge-aware feeEstimator should be bumping priority fees. Check feeStats p99 spread and fee-bump queue.

      # ── Network-reset detection (SPIKE-100 / #766) ──────────────────────
      #
      # A Stellar network reset (testnet wipe, ledger-sequence rollback) looks
      # identical to a prolonged outage from the relayer's perspective: ledger age
      # grows beyond any reasonable block time.  The two events require completely
      # different runbook responses — an outage waits for the RPC to recover,
      # while a reset requires wiping the local SQLite cache and re-syncing from
      # ledger 0.  The alerts below distinguish them by combining ledger-age with
      # a ledger-sequence regression signal.
      #
      # Runbook:
      #   - ZKVoteNetworkLedgerStale alone  → wait; page on-call after for:
      #   - ZKVoteNetworkLedgerReset firing  → execute network-reset runbook:
      #       1. Stop relayer
      #       2. sqlite3 data/zkvote.db "DELETE FROM processed_events;"
      #       3. Reset horizon cursor: rm data/horizon_cursor.txt
      #       4. Restart relayer; confirm ledger_sequence_number rising in Grafana

      - alert: ZKVoteNetworkLedgerStale
        # Horizon reports a last_ledger_close_time; we derive age from current
        # wall time minus that timestamp.  >120 s is two missed 5-s ledger slots.
        expr: (time() - zkvote_horizon_last_ledger_close_time_seconds) > 120
        for: 3m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: Stellar ledger has not advanced for >2 minutes
          description: >
            zkvote_horizon_last_ledger_close_time_seconds is stale.  Could be a
            transient RPC outage or a network reset.  Monitor ZKVoteNetworkLedgerReset
            to distinguish.  If only this alert fires, wait for recovery; if both
            fire, follow the network-reset runbook.

      - alert: ZKVoteNetworkLedgerReset
        # A ledger-sequence regression (current sequence < previous recorded max)
        # is the definitive signal for a network reset.  The relayer gauge
        # zkvote_horizon_ledger_sequence tracks the latest sequence seen; a
        # decrease_over_time indicates the ledger rolled back.
        expr: decrease(zkvote_horizon_ledger_sequence[10m]) > 1000
        for: 1m
        labels:
          severity: critical
          service: zkvote-relayer
        annotations:
          summary: Stellar ledger sequence regression detected — possible network reset
          description: >
            zkvote_horizon_ledger_sequence decreased by >1 000 in the last 10 minutes.
            This is the canonical signal for a testnet/network reset.  Execute the
            network-reset runbook immediately: stop the relayer, wipe processed_events,
            remove the horizon cursor file, then restart and verify sequence is climbing.

  # ── Product SLI/SLO alerts (SPIKE-049) ─────────────────────────────────────
  #
  # The alerts below cover the user-visible journeys that were previously
  # unmonitored: vote inclusion latency, ZK proving success rate, anchor
  # settlement aging, and PII-in-logs detection.
  #
  # Runbooks:
  #   VoteInclusionLatencyHigh  → check relayer queue depth, Stellar congestion,
  #                               fee-bump pipeline; escalate to on-call if >15 min
  #   ProvingSuccessRateLow     → check prover worker logs, circuit WASM hash vs
  #                               registry pin, WebWorker memory pressure
  #   AnchorSettlementStale     → check bridge relayer, EVM RPC endpoint, gas price
  #   PIIDetectedInLogs         → page security on-call immediately; rotate log
  #                               storage credentials; purge affected log batch

  - name: zkvote-product-slo
    rules:
      - alert: ZKVoteVoteInclusionLatencyHigh
        # SLO: 95% of votes should be included within 30 seconds of submission.
        # zkvote_vote_inclusion_latency_seconds tracks time from relayer receipt
        # to on-chain confirmation.
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(zkvote_vote_inclusion_latency_seconds_bucket[10m]))
          ) > 30
        for: 5m
        labels:
          severity: warning
          service: zkvote-relayer
          slo: vote_inclusion
        annotations:
          summary: Vote inclusion p95 latency exceeds 30-second SLO
          description: >
            The 95th-percentile vote inclusion latency has exceeded 30 seconds for 5
            minutes. Check the relayer submission queue, Stellar congestion, and the
            fee-bump pipeline.

      - alert: ZKVoteVoteInclusionLatencyCritical
        expr: >
          histogram_quantile(0.95,
            sum by (le) (rate(zkvote_vote_inclusion_latency_seconds_bucket[10m]))
          ) > 900
        for: 5m
        labels:
          severity: critical
          service: zkvote-relayer
          slo: vote_inclusion
        annotations:
          summary: Vote inclusion p95 latency exceeds 15-minute critical threshold
          description: >
            The 95th-percentile vote inclusion latency has exceeded 15 minutes for 5
            minutes. Votes may be silently dropped or stuck in the submission queue.
            Escalate to on-call immediately.

      - alert: ZKVoteProvingSuccessRateLow
        # SLO: ZK proof generation should succeed at ≥99% of attempts.
        # zkvote_prove_total{result="success|failure"} tracks prover outcomes.
        expr: >
          sum(rate(zkvote_prove_total{result="success"}[10m])) /
          clamp_min(sum(rate(zkvote_prove_total[10m])), 0.001) < 0.99
        for: 5m
        labels:
          severity: warning
          service: zkvote-prover
          slo: proving_success
        annotations:
          summary: ZK proving success rate has dropped below 99% SLO
          description: >
            Fewer than 99% of ZK proof attempts are succeeding over the last 10
            minutes. Check prover worker logs, WASM circuit hash against the circuit
            registry pin, and WebWorker memory pressure.

      - alert: ZKVoteProvingSuccessRateCritical
        expr: >
          sum(rate(zkvote_prove_total{result="success"}[10m])) /
          clamp_min(sum(rate(zkvote_prove_total[10m])), 0.001) < 0.90
        for: 3m
        labels:
          severity: critical
          service: zkvote-prover
          slo: proving_success
        annotations:
          summary: ZK proving success rate has collapsed below 90%
          description: >
            Fewer than 90% of ZK proof attempts are succeeding. The voting feature
            is effectively broken for most users. Escalate to on-call immediately
            and consider disabling the frontend proving flow.

      - alert: ZKVoteAnchorSettlementStale
        # SLO: Bridge anchor settlements should complete within 10 minutes of
        # EVM event emission.
        # zkvote_anchor_settlement_age_seconds tracks age of the oldest unsettled anchor.
        expr: zkvote_anchor_settlement_age_seconds > 600
        for: 5m
        labels:
          severity: warning
          service: zkvote-bridge
          slo: anchor_settlement
        annotations:
          summary: Bridge anchor settlement is aging beyond 10-minute SLO
          description: >
            The oldest unsettled bridge anchor is more than 10 minutes old. Check the
            bridge relayer, EVM RPC endpoint health, and gas price estimates.

      - alert: ZKVoteAnchorSettlementCritical
        expr: zkvote_anchor_settlement_age_seconds > 3600
        for: 5m
        labels:
          severity: critical
          service: zkvote-bridge
          slo: anchor_settlement
        annotations:
          summary: Bridge anchor settlement stalled for over 1 hour
          description: >
            A bridge anchor has been unsettled for over 1 hour. Cross-chain votes
            submitted through the bridge are not being recorded. Escalate immediately.

      - alert: ZKVotePIIDetectedInLogs
        # zkvote_pii_log_detections_total is incremented by the log-scrubber
        # middleware whenever a raw IP address, Stellar address (G.../S...), or
        # full nullifier value is detected in a log line that was not redacted.
        # Any non-zero rate is a policy violation requiring immediate response.
        expr: sum(rate(zkvote_pii_log_detections_total[5m])) > 0
        for: 1m
        labels:
          severity: critical
          service: zkvote-relayer
          pii: "true"
        annotations:
          summary: PII detected in application logs — immediate action required
          description: >
            The log-scrubber middleware has detected unredacted PII (voter IP,
            Stellar address, nullifier, or other sensitive field) in application
            logs. Page the security on-call immediately. Rotate log storage
            credentials and purge the affected log batch before sharing with
            any third party.

      - alert: ZKVoteDevRelayerObservabilityGap
        # Detects when the dev:relayer process is running but emitting zero
        # metrics — a sign the observability instrumentation is not active in
        # the local development profile (SPIKE-049).
        expr: >
          up{job="zkvote-dev-relayer"} == 1
          and sum(rate(zkvote_http_requests_total{env="development"}[5m])) == 0
        for: 10m
        labels:
          severity: warning
          service: zkvote-relayer
        annotations:
          summary: dev:relayer is running but emitting no metrics
          description: >
            The development relayer process is running but the Prometheus scrape
            target shows no request metrics. The metrics middleware may not be
            registered in the development profile. Developers will not see the
            observability signals that production depends on.
