# Fly.io configuration for ZKVote Relayer
# https://fly.io/docs/reference/configuration/

app = "zkvote-relayer"
primary_region = "sjc"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8080"
  NODE_ENV = "production"
  # Non-sensitive config - secrets set via `fly secrets set`
  SOROBAN_RPC_URL = "https://rpc-futurenet.stellar.org"
  NETWORK_PASSPHRASE = "Test SDF Future Network ; October 2022"
  # Matches [[vm]] memory below; used by the memory monitor to compute
  # usage ratio and trigger a graceful restart before the container OOMs.
  MEMORY_LIMIT_MB = "512"

# SIGTERM is drained by index.ts's gracefulShutdown() (in-flight requests
# finish, background services stop, then the process exits). kill_timeout
# must exceed that internal drain timeout (25s) or Fly will SIGKILL first.
kill_signal = "SIGTERM"
kill_timeout = "35s"

[deploy]
  # Rolling deploy: the new machine must pass its health checks before the
  # old one is stopped, so there's no window with zero healthy instances.
  # release_command runs migration status check before deployment finishes.
  strategy = "rolling"
  release_command = "node --enable-source-maps dist/services/migrate.js status"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[http_service.checks]]
  interval = "30s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

# Prometheus metrics endpoint check
[[http_service.checks]]
  interval = "15s"
  timeout = "5s"
  grace_period = "10s"
  method = "GET"
  path = "/metrics"

[mounts]
  source = "zkvote_data"
  destination = "/app/data"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
